name: reusable-dotnet-ci

on:
  workflow_call:
    inputs:
      test-project:
        description: "Path to the test .csproj"
        required: true
        type: string
      dotnet-version:
        description: ".NET SDK version"
        required: false
        default: "10.0.x"
        type: string
      coverage-threshold:
        description: "Minimum line coverage (percent)"
        required: false
        default: "80"
        type: string
      runs-on:
        description: "GitHub Actions runner label (e.g. ubuntu-latest, windows-latest)"
        required: false
        default: "ubuntu-latest"
        type: string
      build-command:
        description: "Optional shell command run before dotnet test (e.g. dotnet build -c Release)"
        required: false
        default: ""
        type: string
      pre-restore-command:
        description: "Optional shell command run before dotnet test (e.g. populate a local NuGet feed)"
        required: false
        default: ""
        type: string
      test-filter:
        description: "Optional VSTest filter expression (e.g. TestCategory!=E2E)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ inputs['runs-on'] }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Pre-restore preparation
        if: inputs.pre-restore-command != ''
        shell: pwsh
        run: ${{ inputs.pre-restore-command }}

      - name: Build
        if: inputs.build-command != ''
        shell: pwsh
        run: ${{ inputs.build-command }}

      - name: Test with coverage gate
        # shortcut: filtro entra via expressão condicional para não deixar "--filter" vazio quando o input não é usado
        run: >
          dotnet test ${{ inputs.test-project }}
          -c Release
          -p:CollectCoverage=true
          -p:CoverletOutputFormat=cobertura
          -p:Threshold=${{ inputs.coverage-threshold }}
          -p:ThresholdType=line
          ${{ inputs.test-filter != '' && format('--filter={0}', inputs.test-filter) || '' }}
