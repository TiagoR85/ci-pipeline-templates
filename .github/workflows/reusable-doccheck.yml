name: reusable-doccheck

on:
  workflow_call:
    inputs:
      doccheck-ref:
        description: "doccheck git ref; pin a tag so the gate is reproducible"
        required: false
        default: "v0.3.1"
        type: string
      path:
        description: "Repository path to check (default: root)"
        required: false
        default: "."
        type: string
      fail-on-findings:
        description: "true = gate (exit 1 on findings); false = report only"
        required: false
        default: true
        type: boolean
      python-version:
        description: "Python version"
        required: false
        default: "3.13"
        type: string
      runs-on:
        description: "GitHub Actions runner label"
        required: false
        default: "ubuntu-latest"
        type: string

permissions:
  contents: read

jobs:
  doccheck:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install doccheck (pinned)
        run: python -m pip install --quiet "git+https://github.com/TiagoR85/doccheck.git@${{ inputs.doccheck-ref }}"

      - name: doccheck check (gate)
        if: inputs.fail-on-findings
        run: doccheck check "${{ inputs.path }}"

      - name: doccheck check (report only)
        if: ${{ !inputs.fail-on-findings }}
        run: doccheck check "${{ inputs.path }}" --nao-falhar
